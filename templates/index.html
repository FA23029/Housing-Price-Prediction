<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Housing Price Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>🏠 AI Housing Price Predictor</h1>
    <p class="subtitle">Predict smart housing prices using Machine Learning</p>

    <form action="/predict" method="POST">

    <div class="input-box">
        <label>Longitude</label>
        <input type="text" name="longitude" required>
    </div>

    <div class="input-box">
        <label>Latitude</label>
        <input type="text" name="latitude" required>
    </div>

    <div class="input-box">
        <label>House Age</label>
        <input type="text" name="housing_median_age" required>
    </div>

    <div class="input-box">
        <label>Total Rooms</label>
        <input type="text" name="total_rooms" required>
    </div>

    <div class="input-box">
        <label>Total Bedrooms</label>
        <input type="text" name="total_bedrooms" required>
    </div>

    <div class="input-box">
        <label>Population</label>
        <input type="text" name="population" required>
    </div>

    <div class="input-box">
        <label>Households</label>
        <input type="text" name="households" required>
    </div>

    <div class="input-box">
        <label>Median Income</label>
        <input type="text" name="median_income" required>
    </div>

    <div class="input-box">
        <label>Ocean Proximity</label>
        <select name="ocean_proximity">
            <option value="<1H OCEAN"><1H OCEAN</option>
            <option value="INLAND">INLAND</option>
            <option value="ISLAND">ISLAND</option>
            <option value="NEAR BAY">NEAR BAY</option>
            <option value="NEAR OCEAN">NEAR OCEAN</option>
        </select>
    </div>

    <button type="submit">Predict House Price</button>

</form>

    {% if prediction_text %}
        <div class="result">
            {{ prediction_text }}
        </div>
    {% endif %}

</div>

</body>
</html>
